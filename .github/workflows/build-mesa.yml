name: build-mesa-panvk

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Mesa release (e.g. 26.2.7)"
        required: true
        default: "26.2.7"
  push:
    branches: [main]
    paths:
      - "mesa/**"
      - ".github/workflows/build-mesa.yml"

permissions:
  contents: write

concurrency:
  group: mesa-${{ github.ref }}
  cancel-in-progress: false

env:
  MESA_VERSION: ${{ github.event.inputs.version || '26.2.7' }}
  NDK_VERSION: r28c
  NDK_API: "34"
  NDK_DIR: /opt/android-ndk
  HOST_PREFIX: /opt/mesa-host
  BUILD_LOG: ${{ github.workspace }}/mesa-build.log

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build pkg-config lld patchelf xz-utils unzip \
            python3-mako python3-yaml python3-packaging python3-setuptools \
            bison flex cmake curl ca-certificates \
            llvm-18-dev libclang-cpp18-dev libclang-18-dev libclang-common-18-dev \
            libllvmspirvlib-18-dev spirv-tools clang-18

      - name: Install Meson (>= 1.4)
        run: |
          python3 -m venv "$HOME/meson-venv"
          "$HOME/meson-venv/bin/pip" install --upgrade pip
          "$HOME/meson-venv/bin/pip" install "meson>=1.4,<2" mako packaging pyyaml
          echo "$HOME/meson-venv/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          meson --version
          ninja --version
          patchelf --version
          /usr/lib/llvm-18/bin/llvm-config --version
          pkg-config --modversion SPIRV-Tools

      - name: Fetch Mesa source
        run: |
          set -o pipefail
          curl -fL --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/mesa.tar.xz" \
            "https://archive.mesa3d.org/mesa-${MESA_VERSION}.tar.xz"
          tar -xJf "$RUNNER_TEMP/mesa.tar.xz" -C "$GITHUB_WORKSPACE"
          mv "$GITHUB_WORKSPACE/mesa-${MESA_VERSION}" "$GITHUB_WORKSPACE/mesa"
          rm -f "$RUNNER_TEMP/mesa.tar.xz"
          head -20 "$GITHUB_WORKSPACE/mesa/meson.build"

      - name: Fetch Android NDK
        run: |
          set -o pipefail
          curl -fL --retry 5 --retry-delay 5 -o "$RUNNER_TEMP/ndk.zip" \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          sudo unzip -q "$RUNNER_TEMP/ndk.zip" -d /opt
          sudo mv "/opt/android-ndk-${NDK_VERSION}" "$NDK_DIR"
          rm -f "$RUNNER_TEMP/ndk.zip"
          ls "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep "aarch64-linux-android${NDK_API}-clang$"

      - name: Build host shader compilers
        run: |
          set -o pipefail
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          cd "$GITHUB_WORKSPACE/mesa"
          meson setup build-compiler \
            -Dprefix="$HOST_PREFIX" \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dplatforms= \
            -Dgallium-drivers=panfrost \
            -Dvulkan-drivers= \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglx=disabled \
            -Degl=disabled \
            -Dmesa-clc=enabled \
            -Dinstall-mesa-clc=true \
            -Dtools=panfrost \
            -Dinstall-precomp-compiler=true \
            -Dallow-fallback-for=libdrm 2>&1 | tee "$BUILD_LOG"
          meson install -C build-compiler 2>&1 | tee -a "$BUILD_LOG"
          ls -l "$HOST_PREFIX/bin" || true
          echo "$HOST_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Write meson cross file
        run: |
          cat > "$GITHUB_WORKSPACE/android-aarch64.txt" <<EOF
          [binaries]
          ar = '$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          c = '$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${NDK_API}-clang'
          cpp = ['$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android${NDK_API}-clang++', '-fno-exceptions', '-fno-unwind-tables', '-fno-asynchronous-unwind-tables', '-static-libstdc++']
          strip = '$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF
          cat "$GITHUB_WORKSPACE/android-aarch64.txt"

      - name: Configure Android build
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/mesa"
          export PATH="$HOST_PREFIX/bin:/usr/lib/llvm-18/bin:$PATH"
          meson setup build-android \
            --cross-file "$GITHUB_WORKSPACE/android-aarch64.txt" \
            -Dplatforms=android \
            -Dplatform-sdk-version="$NDK_API" \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Degl=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=panfrost \
            -Dallow-fallback-for=libdrm \
            -Dmesa-clc=system \
            -Dprecomp-compiler=system \
            -Dbuildtype=release \
            -Dstrip=true \
            -Db_ndebug=true 2>&1 | tee -a "$BUILD_LOG"
          meson configure build-android | grep -E "vulkan|platform|gallium|android" || true

      - name: Compile
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/mesa"
          export PATH="$HOST_PREFIX/bin:/usr/lib/llvm-18/bin:$PATH"
          ninja -C build-android -j"$(nproc)" 2>&1 | tee -a "$BUILD_LOG" | tail -40

      - name: Collect and patch driver
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/mesa"
          mkdir -p "$GITHUB_WORKSPACE/out"
          SRC="$(find build-android -name 'libvulkan_panfrost.so' -type f | head -1)"
          test -n "$SRC"
          echo "found: $SRC"
          cp "$SRC" "$GITHUB_WORKSPACE/out/vulkan.panfrost.so"
          patchelf --set-soname vulkan.panfrost.so "$GITHUB_WORKSPACE/out/vulkan.panfrost.so"
          cd "$GITHUB_WORKSPACE/out"
          file vulkan.panfrost.so
          ls -l vulkan.panfrost.so
          { readelf -d vulkan.panfrost.so | grep -E 'NEEDED|SONAME' || true; } > dynamic.txt
          { readelf -h vulkan.panfrost.so | grep -E 'Class|Machine|Type' || true; } >> dynamic.txt
          { readelf -sW vulkan.panfrost.so | grep -E 'HAL_MODULE_INFO_SYM|HWVULKAN|hal_module_info' | head -20 || true; } > symbols.txt
          test -s dynamic.txt || echo "readelf dynamic section unavailable" > dynamic.txt
          test -s symbols.txt || echo "no HAL symbols matched after strip" > symbols.txt
          printf 'mesa %s\n' "$MESA_VERSION" > MESA_VERSION.txt
          sha256sum vulkan.panfrost.so > vulkan.panfrost.so.sha256
          cat dynamic.txt symbols.txt MESA_VERSION.txt

      - name: Report Mesa failure
        if: failure()
        run: |
          python3 - "$BUILD_LOG" <<'PYEOF'
          import re
          import sys
          try:
              lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          except OSError as exc:
              lines = ["<no build log: %s>" % exc]
          hits = [l for l in lines if re.search(
              r"error:|fatal error|FAILED:|undefined reference|No such file|not found|ERROR:",
              l, re.I)]
          tail = hits[-20:] or lines[-40:]
          print("\n".join(tail))
          msg = "\n".join(tail[-20:])
          esc = msg.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error title=mesa-build::" + esc[:20000])
          PYEOF
          exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesa-${{ env.MESA_VERSION }}-panvk
          path: out/*
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mesa-${{ env.MESA_VERSION }}-panvk-${{ github.run_number }}
          name: "Mesa ${{ env.MESA_VERSION }} PanVK for RK3588S (Orange Pi 5)"
          body: |
            Mesa `${{ env.MESA_VERSION }}` PanVK (Vulkan) built out-of-tree with the
            Android NDK `${{ env.NDK_VERSION }}` (API `${{ env.NDK_API }}`), Vulkan-only,
            EGL/GLES disabled, libdrm built from the Meson wrap.

            Drop-in for the vendor partition: `vulkan.panfrost.so` goes to
            `/vendor/lib64/hw/` and is loaded as the built-in Vulkan HAL when
            `ro.hardware.vulkan=panfrost` and `ro.vulkan.apex` is unset.
          files: out/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
